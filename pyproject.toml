[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-linguistics-toolkit-for-Chinese"
version = "0.1.0"
description = "A Python toolkit for analysing Chinese corpora"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "opencc-python-reimplemented",
    "selenium",
    "matplotlib",
    "jieba"
]

[tool.setuptools.packages.find]
include = ["toolkit*"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-linguistics-toolkit-for-Chinese"
version = "0.1.0"
description = "A Python toolkit for analysing Chinese corpora"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "ksphere0013", email = "ksphere0013@gmail.com"}
]

license = {text = "MIT"}

keywords = [
    "corpus linguistics",
    "Chinese corpus",
    "NLP",
    "Python"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "requests",
    "beautifulsoup4",
    "opencc-python-reimplemented",
    "selenium",
    "matplotlib",
    "jieba"
]

[project.urls]
Homepage = "https://github.com/ksphere0013/Corpus-Linguistics-Toolkit-for-Chinese"
Issues = "https://github.com/ksphere0013/Corpus-Linguistics-Toolkit-for-Chinese/issues"

[tool.setuptools.packages.find]
include = ["toolkit*"]